  inferred_outer_frame: "one closed 528-vertex CRS84 Polygon; bbox [100.8974531, 13.2383789, 100.9643072, 13.3175765]; 13,974 bytes; sha256 8f0661e695b20e606fd38084ca5d4281b3b318ea054cf4dadf74b4c1033eac9e"
  inferred_outer_frame_derivation: "Shapely 2.0.7 / GEOS 3.11.4 unary_union in source CRS84; retain and orient the union exterior ring; fill ten topology micro-holes totalling 63.8914 m2; rotate to a deterministic lexicographic start; canonical compact JSON plus newline"
  inferred_outer_frame_validation: "valid Polygon; covers 23/23 source community polygons; zero outside area; exterior area 20,162,822.3497 m2; perimeter 28,312.2449 m; measurements after transform to EPSG:32647 with pyproj 3.6.1 / PROJ 9.3.0; convex hull rejected because it would add 12.633 km2 (62.66%) beyond the supplied geometry"
  inferred_outer_frame_role: "owner-requested working extent derived from the supplied community layer; explicitly not an official municipal, legal, cadastral, or property boundary"
  truth_boundary: "Position coverage is not accuracy. Frontage, imagery, registered-business addresses, roads, community polygons, and the derived outer frame are supporting context rather than field verification, operating-business proof, property rights, or legal boundaries."
  source_discrepancies:
    - "display v3 review_score is blank on all 42,524 rows while the separate QA review list carries scores; UI orders by priority and stable source order without inventing score"
    - "business_count counts registration-tag rows, not guaranteed distinct companies; the work order says business_names contains at most three names, but display v3 has 20 rows above three and a maximum of 56, so the UI previews three and reports the remainder"
    - "registry business tags v5 has no pipeline_run_id column although the work order says every data file carries it; exact hash plus aggregate parity with display v3 bind it to this delivery without inventing a field"
    - "figures/work-order/run-report state 72 no-coordinate rows with one candidate parcel while manifest v9 states 73 and reports a different offered-row total; the website does not present this as a reconciled aggregate"
    - "the run report retains prior-round frontage copy (13,960 / 8,036 / 9,630) and a 102-key/19-check table entry; display v3, figures v3, and manifest v9 agree on 13,959 / 8,042 / 9,634, 103 keys, and 20 checks, which are the release values"
    - "soi_name_check labels also occur on no-coordinate rows; the 9,775 verified-row figure is the positioned subset and must not be inferred by counting all display labels"

coordinate_adjustment:
  role: "local evidence-backed patch proposal; never mutates the loaded source row and never claims an authoritative correction"
  coordinate_separation: "source_lat/source_lon and proposed_lat/proposed_lon remain separate; source and proposal use distinct map markers with a comparison connector"
  actions: "existing valid coordinate -> move_existing; both source coordinates absent -> place_missing; partial or invalid source coordinate pairs fail closed"
  evidence_gate: "reason, evidence source/reference/date, reviewer code, adjustment ID, and UTC timestamp are required; A0 and multi-unit/building rows require a strong evidence source"
  export_contract: "27 ordered columns; draft-unverified status; includes movement, EPSG:4326, source run ID, source SHA-256, source dataset contract, source uncertainty fields, tool release, and export batch ID"
  lifecycle: "working proposals remain in tab memory; export is an auditable local CSV patch and does not overwrite the source CSV or update the upstream pipeline"
  downstream_acceptance: "an authorized reviewer must accept and apply a proposal upstream before any new master/display dataset can treat it as source truth"

loader_resilience:
  primary_path: "dedicated Web Worker using the pinned display-v3 parser"
  fallback_path: "one in-tab retry with the same pinned parser only when Worker construction, transport, or execution fails"
  fail_closed_boundary: "a parser-reported file, hash, schema, row, run-ID, or aggregate validation error is authoritative and is never retried as an acceptance bypass"
  cache_identity: "main parser, Worker URL, and Worker parser import share revision 20260908-display-v3-r3"

map_review_experience:
  primary_route: "The map receives a wider two-column desktop layout through 1600 CSS px; the record detail moves below rather than squeezing the map into a narrow centre column."
  focused_view: "A labelled 44px action expands the map to the full review-workspace width, temporarily removes the queue and detail panes from layout and accessibility navigation, preserves all record/draft/basemap state, refreshes Leaflet geometry, and returns with the same action or Escape."
  legend: "A native details disclosure starts closed; its open body is scroll-bounded over desktop imagery and reflows statically below the map on small screens."
  mobile: "Existing queue/map/detail tabs remain the mobile navigation; the redundant desktop expansion control is hidden below 768 CSS px."

privacy:
  public_payload: "interface, aggregate facts, index-safe community polygons, their one-feature inferred outer frame, and governed brand/design assets only"
  local_only: "display CSV, household IDs, addresses, exact source/proposed coordinates, company-address detail, draft review notes, and coordinate-adjustment exports"
  data_lifecycle: "record data, review drafts, and coordinate proposals remain in tab memory; no service worker, analytics, URL state, IndexedDB, sessionStorage, or localStorage for record data; an export occurs only after the officer explicitly requests a local file"
  outbound: "basemaps are opt-in; Google links are explicit and coordinate-only"
  google_sheet_loading: "not implemented; local approved-CSV selection remains the owner-facing default; any later private-Sheet route requires a separately configured Google sign-in flow and verified access design"

